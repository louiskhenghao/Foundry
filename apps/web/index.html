<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundry</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // before the first paint, so nothing flashes: light or dark (saved, or the computer's), and the chosen theme's
      // stylesheet and layout as theme.ts last kept them
      try {
        var t = localStorage.getItem('foundry.theme');
        if (t === 'light' || (!t && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.classList.add('light');
        var css = localStorage.getItem('foundry.themeCss');
        if (css) {
          var s = document.createElement('style');
          s.id = 'foundry-theme';
          s.textContent = css;
          document.head.appendChild(s);
        }
        var layout = JSON.parse(localStorage.getItem('foundry.themeLayout') || 'null');
        if (layout) for (var k in layout) document.documentElement.setAttribute('data-' + k, layout[k]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
